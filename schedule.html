  <script>
    function parseCsv(text) {
      const rows = [];
      let row = [], cell = "", inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i], next = text[i + 1];
        if (ch === '"' && inQuotes && next === '"') { cell += '"'; i++; continue; }
        if (ch === '"') { inQuotes = !inQuotes; continue; }
        if (ch === "," && !inQuotes) { row.push(cell); cell = ""; continue; }
        if ((ch === "\n" || ch === "\r") && !inQuotes) {
          if (ch === "\r" && next === "\n") i++;
          row.push(cell); cell = "";
          if (row.some(v => String(v).trim() !== "")) rows.push(row);
          row = [];
          continue;
        }
        cell += ch;
      }
      if (cell || row.length) { row.push(cell); rows.push(row); }
      const headers = rows.shift().map(h => h.trim());
      return rows.map(cols => {
        const obj = {};
        headers.forEach((h, i) => obj[h] = (cols[i] || "").trim());
        return obj;
      });
    }

    function stageType(stage) {
      const s = String(stage || "").toLowerCase();
      if (s.includes("round") || s.includes("quarter") || s.includes("semi") || s.includes("final") || s.includes("third")) return "knockout";
      return "group";
    }

    function dateLabel(value) {
      if (!value) return "日期待定";
      const parts = value.split("-");
      if (parts.length === 3) return `${parts[1]}月${parts[2]}日`;
      return value;
    }

    function sideName(row, side) {
      const name = row[side === "a" ? "team_a" : "team_b"] || "";
      const code = row[side === "a" ? "team_a_code" : "team_b_code"] || "";
      const placeholder = row[side === "a" ? "team_a_placeholder" : "team_b_placeholder"] || "";
      if (name && name !== "TBD") return name;
      if (code && code !== "TBD") return code;
      if (placeholder && placeholder !== "false") return placeholder;
      return "待定";
    }

    function renderTimeline(rows, filter = "all") {
      const root = document.getElementById("schedule-timeline-root");
      const list = rows
        .filter(r => filter === "all" || stageType(r.stage) === filter)
        .sort((a, b) => {
          const da = String(a.match_date || "");
          const db = String(b.match_date || "");
          if (da !== db) return da.localeCompare(db);
          return String(a.kickoff || "").localeCompare(String(b.kickoff || ""));
        });

      if (!list.length) {
        root.innerHTML = '<div class="timeline-empty">暂无赛程数据。</div>';
        return;
      }

      const groups = {};
      list.forEach(r => {
        const key = r.match_date || "date_pending";
        if (!groups[key]) groups[key] = [];
        groups[key].push(r);
      });

      root.innerHTML = Object.keys(groups).map(date => {
        const dayRows = groups[date];
        return `
          <section class="timeline-day">
            <div class="timeline-day-head">
              <h2>${dateLabel(date)}</h2>
              <span>${dayRows.length} 场比赛</span>
            </div>
            <div class="timeline-grid">
              ${dayRows.map(m => {
                const id = m.match_id || "";
                const a = sideName(m, "a");
                const b = sideName(m, "b");
                const type = stageType(m.stage);
                return `
                  <a class="timeline-card" href="./match.html?id=${encodeURIComponent(id)}">
                    <div class="timeline-meta">
                      <span>${m.stage || "阶段待定"}</span>
                      <strong>${m.match_date || ""}</strong>
                    </div>
                    <span class="timeline-stage-badge">${type === "group" ? (m.group || "小组赛") : "淘汰赛路径"}</span>
                    <div class="timeline-teams">
                      <div class="timeline-side"><strong>${a}</strong><small>${m.team_a_code || ""}</small></div>
                      <div class="timeline-vs">VS</div>
                      <div class="timeline-side"><strong>${b}</strong><small>${m.team_b_code || ""}</small></div>
                    </div>
                    <div class="timeline-info">
                      开球：${m.kickoff || "待定"}<br>
                      ${m.city || ""}${m.country ? ", " + m.country : ""}<br>
                      ${m.stadium || ""}
                    </div>
                    <div class="timeline-card-cta">点击进入本场数据看板 →</div>
                  </a>
                `;
              }).join("")}
            </div>
          </section>
        `;
      }).join("");
    }

    async function init() {
      const root = document.getElementById("schedule-timeline-root");
      try {
        const text = await fetch("./data/matches.csv?v=" + Date.now()).then(r => r.text());
        const rows = parseCsv(text);
        renderTimeline(rows, "all");

        document.querySelectorAll("#timeline-filters button").forEach(btn => {
          btn.addEventListener("click", () => {
            document.querySelectorAll("#timeline-filters button").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            renderTimeline(rows, btn.dataset.filter);
          });
        });
      } catch (err) {
        root.innerHTML = '<div class="timeline-empty">赛程数据读取失败，请检查 data/matches.csv。</div>';
      }
    }

    init();
  </script>
